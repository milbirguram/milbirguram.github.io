<!doctype html><html lang="en"><meta charset="utf-8"><title>Gambit worker responsiveness</title><body><h1>Gambit worker responsiveness</h1><button id="run">Run worker check</button><pre id="result">Ready</pre><script src="../model.js"></script><script>
document.getElementById('run').onclick=function(){var out=document.getElementById('result'),worker=new Worker('../worker.js'),last=performance.now(),delays=[],tasks=[],observer=null;
if(window.PerformanceObserver&&PerformanceObserver.supportedEntryTypes.indexOf('longtask')>=0){observer=new PerformanceObserver(function(list){list.getEntries().forEach(function(e){tasks.push(e.duration);});});observer.observe({type:'longtask',buffered:false});}
var timer=setInterval(function(){var now=performance.now();delays.push(Math.max(0,now-last-10));last=now;},10),start=performance.now();out.textContent='Searching in worker…';worker.onmessage=function(e){if(e.data.kind!=='done')return;clearInterval(timer);if(observer){observer.takeRecords().forEach(function(e){tasks.push(e.duration);});observer.disconnect();}var r=e.data.result;out.textContent=JSON.stringify({passed:Math.max.apply(null,delays)<50&&tasks.length===0,wallMs:performance.now()-start,searchNodes:r.nodes,depth:r.depth,timerIntervalMs:10,maxTimerDelayMs:Math.max.apply(null,delays),mainThreadLongTasks:tasks,userAgent:navigator.userAgent,checkedAt:new Date().toISOString()},null,2);worker.terminate();};worker.postMessage({id:1,fen:'r1bqk2r/ppp2ppp/2n2n2/3pp3/3PP3/2N2N2/PPP2PPP/R1BQK2R[Bb] w KQkq - 0 1',options:{depth:6,timeMs:1800}});};
</script></body></html>
