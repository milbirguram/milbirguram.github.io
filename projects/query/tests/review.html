<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent projects — browser checks</title><style>body{font:16px/1.6 system-ui;max-width:850px;margin:50px auto;padding:0 24px}pre{white-space:pre-wrap;background:#eef3ef;padding:20px}iframe{width:100%;height:620px;border:1px solid #ccc}a{color:#234653}</style><h1>Browser worker verification</h1><p>Executes every captured SQL decision through Query’s actual Web Worker and compares the returned rows with the fixed expectation.</p><pre id="results">Loading SQLite…</pre><p><a href="../">Query</a> · <a href="../../trace/">Trace</a> · <a href="../../faultline/">Faultline</a> · <a href="../../trial/">Trial</a></p><script src="../model.js?v=1"></script><script src="../data.js?v=1"></script><script>
(async function(){var out=document.getElementById('results'),worker=new Worker('../worker.js?v=1'),tasks=new Map(),id=0,readyResolve;var ready=new Promise(function(resolve){readyResolve=resolve;});worker.onmessage=function(e){var m=e.data;if(m.type==='ready')return readyResolve();var p=tasks.get(m.id);if(p){tasks.delete(m.id);m.type==='error'?p.reject(Error(m.error)):p.resolve(m);}};function query(sql){return new Promise(function(resolve,reject){var key=++id;tasks.set(key,{resolve:resolve,reject:reject});worker.postMessage({id:key,sql:sql});});}try{await ready;var passed=0;for(var b of QueryData.batches){for(var r of b.rows){var c=QueryData.cases.find(function(c){return c.id===r.id;});if(r.kind==='abstain'){if(c.kind!=='abstain')throw Error('Unexpected abstention');}else{var actual=await query(r.sql);if(!Query.compare(actual.values,c.expected,c.ordered))throw Error(b.condition+'/'+r.id+' differs');}passed++;}}for(var sql of ['DELETE FROM penguins','SELECT 1;SELECT 2','SELECT load_extension(\'x\')',"SELECT printf('%1000001s','x')",'SELECT hex(randomblob(40000000))']){var rejected=false;try{await query(sql);}catch(e){rejected=true;}if(!rejected)throw Error('Unsafe SQL accepted');passed++;}var capped=await query('SELECT * FROM penguins');if(capped.values.length!==200||!capped.capped)throw Error('Row cap failed');passed++;out.textContent='PASS · '+passed+' browser checks\n60 recorded decisions (51 SQL executions + 9 abstentions)\n3 rejected unsafe statements + 2 resource limits\n1 output cap\nActual SQLite WASM worker; no model API.';out.dataset.status='pass';}catch(e){out.textContent='FAIL · '+e.message;out.dataset.status='fail';}finally{worker.terminate();}})();
</script></html>
