<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four agent projects — compact preview review</title><style>body{margin:24px;font:14px system-ui;background:#faf9f6;color:#252821}h1{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,520px);gap:24px}.pair{display:flex;flex-direction:column;align-items:start;gap:12px}iframe{border:1px solid #bbb;display:block}h2{font-size:16px;margin:10px 0 0}p{font-size:12px}</style><h1>Compact preview review</h1><p>Each project is embedded at 320 × 200 and 520 × 325, paused through the shared kit. No running animation is needed for a complete card.</p><div class="grid" id="grid"></div><script>for(var slug of ['query','trace','faultline','trial']){var p=document.createElement('section');p.className='pair';var h=document.createElement('h2');h.textContent=slug;p.append(h);for(var size of [[320,200],[520,325]]){var f=document.createElement('iframe');f.src='../../'+slug+'/?preview';f.title=slug+' '+size.join('×');f.width=size[0];f.height=size[1];f.onload=function(){this.contentWindow.postMessage({kit:'pause'},location.origin);};p.append(f);}document.getElementById('grid').append(p);}</script></html>
