<!doctype html><html lang="en"><meta charset="utf-8"><title>Preview lifecycle verification</title><style>iframe{width:320px;height:200px;border:1px solid #ddd}pre{white-space:pre-wrap}</style><body><h1>Preview lifecycle verification</h1><button id="run">Check previews</button><pre id="result">Ready</pre><div id="frames"></div><script>
document.getElementById('run').onclick=async function(){var results=[],slugs=['gambit','handshake','prism'];document.getElementById('frames').innerHTML='';for(var slug of slugs){var f=document.createElement('iframe');f.src='../../'+slug+'/?preview';document.getElementById('frames').appendChild(f);await new Promise(function(resolve){f.onload=resolve;});var win=f.contentWindow,calls=0,original=win.requestAnimationFrame;win.requestAnimationFrame=function(cb){calls++;return original.call(win,cb);};var before=calls;await new Promise(r=>setTimeout(r,200));var initiallyPaused=calls===before;win.postMessage({kit:'play'},location.origin);await new Promise(r=>setTimeout(r,700));var played=calls>0;win.postMessage({kit:'pause'},location.origin);await new Promise(r=>setTimeout(r,100));before=calls;await new Promise(r=>setTimeout(r,400));results.push({slug:slug,initiallyPaused:initiallyPaused,played:played,pausedNoRAF:calls===before,overflow:win.document.documentElement.scrollWidth>win.innerWidth});}document.getElementById('result').textContent=JSON.stringify({passed:results.every(r=>r.initiallyPaused&&r.played&&r.pausedNoRAF&&!r.overflow),results:results,checkedAt:new Date().toISOString()},null,2);};
</script></body></html>
