<!doctype html><html lang="en"><meta charset="utf-8"><title>Prism GPU comparison</title><body><h1>Prism GPU / CPU verification</h1><button id="run">Run comparison</button><pre id="result">Ready</pre><canvas id="test" width="24" height="15"></canvas><script src="../model.js"></script><script src="../shader.js"></script><script src="../gpu.js"></script><script>
document.getElementById('run').onclick=async function(){var result=document.getElementById('result');result.textContent='Running';try{var g=new PrismGPU(document.getElementById('test'),24,15),options={bounces:8,materials:[2,0,1],dof:false},start=performance.now();for(var s=0;s<512;s++){g.step(options);if(s%16===0)await new Promise(function(resolve){setTimeout(resolve,0);});}var gpu=g.read(),cpu=Prism.render(24,15,512,options),rms=Prism.rms(gpu,cpu),max=0;for(var i=0;i<gpu.length;i++)max=Math.max(max,Math.abs(gpu[i]-cpu[i]));result.textContent=JSON.stringify({passed:rms<.035,width:24,height:15,samples:512,bounces:8,materials:options.materials,dof:false,linearRadianceRMS:rms,maxChannelError:max,toleranceRMS:.035,elapsedMs:performance.now()-start,renderer:g.gl.getParameter(g.gl.RENDERER),userAgent:navigator.userAgent,checkedAt:new Date().toISOString()},null,2);g.dispose();}catch(e){result.textContent=JSON.stringify({passed:false,error:e.message});}};
</script></body></html>
