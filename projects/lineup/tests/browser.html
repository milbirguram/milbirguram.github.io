<!doctype html><html lang="en"><meta charset="utf-8"><title>Portfolio preview checks</title><style>iframe{border:1px solid #aaa}pre{white-space:pre-wrap}</style><h1>Preview lifecycle checks</h1><button id="run">Run checks</button><pre id="result">Ready</pre><div id="frames"></div><script>

document.getElementById('run').onclick=async function(){var results=[];for(var size of [[320,200],[520,325]])for(var slug of ['lineup','creativeos','bonsai']){var f=document.createElement('iframe');f.src='../../'+slug+'/?preview';f.width=size[0];f.height=size[1];document.getElementById('frames').replaceChildren(f);await new Promise(r=>f.onload=r);var win=f.contentWindow,calls=0;function instrument(w){var original=w.requestAnimationFrame;w.requestAnimationFrame=function(cb){calls++;return original.call(w,cb);};w.document.querySelectorAll('iframe').forEach(i=>instrument(i.contentWindow));}instrument(win);await new Promise(r=>setTimeout(r,150));var initial=calls===0;win.postMessage({kit:'play'},location.origin);await new Promise(r=>setTimeout(r,400));var played=calls>0;win.postMessage({kit:'pause'},location.origin);await new Promise(r=>setTimeout(r,100));var before=calls;await new Promise(r=>setTimeout(r,250));var external=win.performance.getEntriesByType('resource').filter(e=>new URL(e.name).origin!==location.origin).map(e=>e.name);results.push({slug,width:size[0],height:size[1],initiallyPaused:initial,played,pausedNoRAF:calls===before,overflow:win.document.documentElement.scrollWidth>win.innerWidth,externalRequests:external});}document.getElementById('result').textContent=JSON.stringify({passed:results.every(r=>r.initiallyPaused&&r.played&&r.pausedNoRAF&&!r.overflow&&!r.externalRequests.length),results,checkedAt:new Date().toISOString()},null,2);};

</script></html>
