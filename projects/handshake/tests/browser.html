<!doctype html><html lang="en"><meta charset="utf-8"><title>Handshake request boundary</title><body><h1>Handshake request boundary</h1><button id="run">Check load and preview privacy</button><pre id="result">Ready</pre><div id="frames"></div><script>
document.getElementById('run').onclick=async function(){var results=[];document.getElementById('frames').innerHTML='';for(var suffix of ['', '?preview']){var f=document.createElement('iframe');f.src='../'+suffix;f.style.cssText='width:375px;height:812px';document.getElementById('frames').appendChild(f);await new Promise(function(resolve){f.onload=resolve;});await new Promise(r=>setTimeout(r,500));var win=f.contentWindow,external=win.performance.getEntriesByType('resource').filter(function(e){return new URL(e.name).origin!==location.origin;}).map(function(e){return e.name;});results.push({mode:suffix?'preview':'full',externalRequestsBeforeButton:external,overflow:win.document.documentElement.scrollWidth>win.innerWidth});}document.getElementById('result').textContent=JSON.stringify({passed:results.every(r=>r.externalRequestsBeforeButton.length===0&&!r.overflow),results:results,checkedAt:new Date().toISOString()},null,2);};
</script></body></html>
